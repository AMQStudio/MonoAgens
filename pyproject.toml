[project]
name = "monoagens"
version = "0.1.0"
description = "A tiny kernel for one persistent AI self that lives in many apps and devices."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary,pool]>=3.3,<3.4",
    "pgvector",
    "fastembed",
    "httpx>=0.28,<0.29",
    "pyyaml",
]

[project.optional-dependencies]
whatsapp = ["neonize>=0.5.2,<0.6", "segno>=1.6"]
discord = ["discord.py>=2.4"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio>=1.3",
]

[tool.uv]
override-dependencies = ["protobuf>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["monoagens"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
