[project]
name = "monoagens-train"
version = "0.1.0"
description = "Offline PyTorch training, calibration, and safetensors export for MonoAgens Neural Cognitive Controller"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch>=2.10",
    "torchvision>=0.20",
    "safetensors>=0.7",
    "blake3>=1.0",
    "sentence-transformers>=6.1.0",
    "transformers>=5.18.0",
    "numpy>=2.0",
    "pillow>=10.0",
    "scipy>=1.14",
    "pytest>=8.0",
]

[project.optional-dependencies]
cpu = ["torch>=2.10"]
cuda = ["torch>=2.10"]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cuda" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monoagens_train"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
