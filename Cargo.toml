[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/core",
    "crates/store",
    "crates/reason",
    "crates/valve",
    "crates/gateway",
    "crates/lab",
    "crates/conformance",
    "crates/tui",
    "crates/cli",
    "plugins/kit",
    "plugins/cli",
    "plugins/mcp-bridge",
    "plugins/sim-actuator",
    "plugins/a2a-bridge",
    "plugins/ros2-bridge",
    "plugins/voice",
    "plugins/telegram",
    "plugins/web-search",
    "plugins/workspace",
    "plugins/pdf-reader",
    "plugins/soul-tuning",
    "examples/cleanroom-body",
]
exclude = ["sdk/rust", "plugins/whatsapp"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
usearch = "2.26"
hnsw_rs = "0.3"
blake3 = "1.8"
safetensors = "0.8.0"
postcard = { version = "1.1", features = ["use-std"] }
tempfile = "3.27"
proptest = "1.12"
monoagens-protocol = { path = "crates/protocol" }
monoagens-core = { path = "crates/core" }
monoagens-store = { path = "crates/store" }
monoagens-reason = { path = "crates/reason" }
monoagens-gateway = { path = "crates/gateway" }
monoagens-tui = { path = "crates/tui" }
monoagens-body-kit = { path = "plugins/kit" }

# Keep debug artifacts small on the 14 GiB / btrfs laptop: our own crates carry
# line tables only, dependencies carry none. `profile.test` inherits `dev`.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false
