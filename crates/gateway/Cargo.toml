[package]
name = "monoagens-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
blake3 = { workspace = true }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
getrandom = "0.4"
monoagens-core = { workspace = true }
monoagens-protocol = { workspace = true }
monoagens-reason = { workspace = true }
monoagens-store = { workspace = true }
monoagens-valve = { path = "../valve" }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
tokio = { version = "1.54", features = ["rt", "sync", "time", "io-util", "net", "process", "macros"] }
toml_edit = "0.25.19"

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros"] }
