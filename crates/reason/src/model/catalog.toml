label = "OpenAI"
dialect = "openai_chat"
base_url = "https://api.openai.com/v1"
api_key_env = ["OPENAI_API_KEY"]
keyless = false
discovery = "models_list"
default_model = ""
docs_url = ""
seed_models = []

