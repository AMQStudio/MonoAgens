[package]
name = "monoagens-lab"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "monoagens-lab"
path = "src/main.rs"

[dependencies]
monoagens-core = { workspace = true }
monoagens-protocol = { workspace = true }
monoagens-reason = { workspace = true }
monoagens-store = { workspace = true }
postcard = { workspace = true }
reqwest = { version = "0.13", features = ["blocking", "json"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
tempfile = { workspace = true }
toml = "0.9"

[dev-dependencies]
criterion = "0.8.2"
jsonschema = "0.61"
proptest = { workspace = true }
rusqlite = { workspace = true }

[[bench]]
name = "r40_scale"
harness = false
