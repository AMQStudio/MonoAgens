[package]
name = "monoagens-conformance"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "monoagens-conformance"
path = "src/main.rs"

[[bin]]
name = "tck-mock-body"
path = "tests/fixtures/mock_body.rs"

[[bin]]
name = "tck-core-harness"
path = "tests/fixtures/core_harness.rs"

[dependencies]
monoagens-core = { workspace = true, features = ["tck-hooks"] }
monoagens-protocol = { workspace = true }
monoagens-store = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
tempfile = { workspace = true }
