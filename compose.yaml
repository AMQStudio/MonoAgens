services:
  db:
    image: pgvector/pgvector:pg17
    container_name: monoagens-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monoagens}
      POSTGRES_USER: ${POSTGRES_USER:-monoagens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monoagens}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
