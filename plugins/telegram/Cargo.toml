[package]
name = "body-telegram"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "body-telegram"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
monoagens-body-kit = { workspace = true }
monoagens-body-sdk = { path = "../../sdk/rust" }
reqwest = { version = "0.13", features = ["blocking", "json", "multipart"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "io-util", "sync", "time", "signal", "net"] }

[dev-dependencies]
tempfile = { workspace = true }
