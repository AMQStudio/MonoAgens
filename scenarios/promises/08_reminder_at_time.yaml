name: 08_reminder_at_time
function: promises
capability: "A reminder asked for a time fires exactly once at that time."
description: >-
  Owner minta diingatkan setor pajak jam 3 sore. PFC harus membuat Expectation,
  lalu tick pada jam itu memicunya tepat satu kali.
expectations:
  - exactly one reminder at 15:00
steps:
  - at: "2026-11-10T09:00:00+07:00"
    who: person:owner
    place: space:tg:1001
    text: "Mona, ingetin aku setor pajak jam 3 sore ya."
    features: {addressed: 1}
  - at: "2026-11-10T09:00:00+07:00"
    advance: "6h"
model_answers:
  - step: 1
    tool: decide
    calls:
      - name: expect
        arguments:
          about: setor pajak jam 3 sore
          kind: promise
          cue_time: {at: "2026-11-10T15:00:00+07:00"}
          expect: {none: true}
          intent: ingatkan owner untuk setor pajak
          weight: 0.7
          policy: {once: true}
  - step: 2
    tool: decide
    calls:
      - name: act
        arguments:
          capability: telegram.say
          arguments: {text: "Waktunya setor pajak ya, jam 3 sore ini."}
