name: 30_same_topic_question
function: promises
capability: "A question on the topic of a promise's condition never fulfils it; the promise waits for the statement."
description: >-
  Two group lines name the document under review and say its news will be
  posted in that group, so the owner's request about "dokumennya" has a
  referent and a watch place. The owner asks to be told when the document is
  done. A group member asks whether the document is done: the cosine gate
  reminds the soul, but the woken PFC lets it be, so the promise stays active
  and no message is sent. When the same member states that the document is
  done, the soul acts on the reminder and the owner hears once in the direct chat.
expectations:
  - type: no_reply
    steps: [1, 2]
    label: ordinary group chatter wakes no one
  - type: event_seen
    kind: expectation.reminded
    step: 4
    count: 1
    label: the question reminds the soul of the promise
  - type: no_reply
    step: 4
    label: the question produces no message
  - type: no_event
    kind: expectation.resolved
    step: 4
    count: 0
    label: the question does not resolve the promise
  - type: reply_in
    place: space:tg:1001
    step: 5
    count: 1
    label: the owner hears once in the direct chat
steps:
  - at: "2026-11-10T08:50:00+07:00"
    who: person:tg:7002
    place: space:tg:-1004
    text: "Proposal anggaran Q4 masih di-review Bu Rina."
    should: silent
  - at: "2026-11-10T08:55:00+07:00"
    who: person:tg:7003
    place: space:tg:-1004
    text: "Iya, kabar selesainya nanti diumumkan di grup ini."
    should: silent
  - at: "2026-11-10T09:00:00+07:00"
    who: person:owner
    place: space:tg:1001
    addressed: true
    text: "kabari aku ya kalau dokumennya sudah selesai"
  - at: "2026-11-10T09:10:00+07:00"
    who: person:tg:7001
    place: space:tg:-1004
    text: "dokumen sudah selesai ya?"
    should: silent
  - at: "2026-11-10T09:20:00+07:00"
    who: person:tg:7001
    place: space:tg:-1004
    text: "dokumennya sudah selesai kok."
    should: answer
model_answers:
  - step: 3
    tool: decide
    calls:
      - name: expect
        arguments:
          about: kabari owner kalau dokumennya sudah selesai
          kind: promise
          cue_event: {kind: percept, place: "space:tg:-1004"}
          expect: {text: "dokumen sudah selesai"}
          intent: beri tahu owner bahwa dokumennya sudah selesai
          weight: 0.8
          policy: {once: true}
  - step: 4
    tool: decide
    calls:
      - name: think
        arguments: {thought: "Itu pertanyaan, bukan kabar selesai; biarkan.", motivation: 1, confidence: 0.6}
  - step: 5
    tool: decide
    calls:
      - name: act
        arguments:
          capability: telegram.say
          arguments: {text: "Dokumennya sudah selesai, owner."}
      - name: resolve
        arguments: {id: 1, status: satisfied}
