name: 30_same_topic_question
function: promises
capability: "A question on the topic of a promise's condition never fulfils it; the promise waits for the statement."
description: >-
  The owner asks to be told when the document is done. A group member asks
  whether the document is done: the cosine gate reminds the soul, but the woken
  PFC lets it be, so the promise stays active and nobody is woken. When the same
  member states that the document is done, the soul acts on the reminder and the
  owner hears once in the direct chat.
expectations:
  - type: no_reply
    step: 2
    label: a question on the same topic wakes no one
  - type: no_event
    kind: expectation.resolved
    step: 2
    count: 0
    label: the question does not resolve the promise
  - type: reply_in
    place: space:tg:1001
    step: 3
    count: 1
    label: the owner hears once in the direct chat
steps:
  - at: "2026-11-10T09:00:00+07:00"
    who: person:owner
    place: space:tg:1001
    addressed: true
    text: "kabari aku ya kalau dokumennya sudah selesai"
  - at: "2026-11-10T09:10:00+07:00"
    who: person:tg:7001
    place: space:tg:-1004
    text: "dokumen sudah selesai ya?"
    should: silent
  - at: "2026-11-10T09:20:00+07:00"
    who: person:tg:7001
    place: space:tg:-1004
    text: "dokumennya sudah selesai kok."
    should: answer
model_answers:
  - step: 1
    tool: decide
    calls:
      - name: expect
        arguments:
          about: kabari owner kalau dokumennya sudah selesai
          kind: promise
          cue_event: {kind: percept, place: "space:tg:-1004"}
          expect: {text: "dokumen sudah selesai"}
          intent: beri tahu owner bahwa dokumennya sudah selesai
          weight: 0.8
          policy: {once: true}
  - step: 2
    tool: decide
    calls:
      - name: think
        arguments: {thought: "Itu pertanyaan, bukan kabar selesai; biarkan.", motivation: 1, confidence: 0.6}
  - step: 3
    tool: decide
    calls:
      - name: act
        arguments:
          capability: telegram.say
          arguments: {text: "Dokumennya sudah selesai, owner."}
      - name: resolve
        arguments: {id: 1, status: satisfied}
