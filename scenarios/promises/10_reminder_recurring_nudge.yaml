name: 10_reminder_recurring_nudge
function: promises
capability: "A recurring reminder fires again on the next day under its policy."
description: >-
  Nudge berulang setiap hari. Satu hari kemudian pengingat pertama terpicu,
  satu hari lagi pengingat kedua harus terpicu (bukan policy sekali saja).
expectations:
  - type: min_replies
    count: 2
    label: recurring nudge fires on both days
steps:
  - at: "2026-11-10T09:00:00+07:00"
    who: person:owner
    place: space:tg:1001
    text: >-
      Mona, tolong buat pengingat berulang ya: cue setiap 1d dengan policy cooldown 1d
      dan max_fires 3; isinya ingetin aku minum air tiap hari jam 9 pagi.
    features: {addressed: 1}
  - at: "2026-11-10T09:00:00+07:00"
    advance: "1d"
  - at: "2026-11-11T09:00:00+07:00"
    advance: "1d"
model_answers:
  - step: 1
    tool: decide
    calls:
      - name: expect
        arguments:
          about: ingatkan owner minum air tiap pagi
          kind: promise
          cue_time: {daily: "09:00"}
          expect: {none: true}
          intent: ingatkan minum air
          weight: 0.6
          policy: {cooldown: 1d, max_fires: 3}
  - step: 2
    tool: decide
    calls:
      - name: act
        arguments:
          capability: telegram.say
          arguments: {text: "Selamat pagi, jangan lupa minum air ya."}
  - step: 3
    tool: decide
    calls:
      - name: act
        arguments:
          capability: telegram.say
          arguments: {text: "Pagi lagi, waktunya minum air."}
