name: 22_patience_turn_taking
function: turn-taking
capability: "Patience holds the floor: the gate's go on an answerable question creates the wait, the sender's follow-up does not cancel it, another person's answer settles it as silence, and an expired window yields one reply."
description: >-
  Patience in a group (core.md §6, core-math.md §4). Mona menyimpan fakta kafe
  dari obrolan grup; ketika seseorang bertanya di kafe mana rapatnya, gate
  terbuka dan kernel menahan lantai dengan satu `wait`: follow-up pengirim yang
  sama tidak membatalkannya, jawaban orang lain menyelesaikannya sebagai diam,
  dan saat jendela kesabaran habis Mona menjawab tepat sekali dengan fakta itu.
expectations:
  - type: sleep_done
    label: the cafe fact is stored before the first question
  - type: no_reply
    steps: [1, 4, 5, 6, 7, 8]
    label: chatter and the sender's own follow-up pass silently
  - type: event_seen
    kind: expectation.created
    payload: {kind: wait}
    steps: [3, 8]
    count: 2
    label: the gate's go on an answerable question creates the wait
  - type: event_seen
    kind: expectation.resolved
    payload: {status: satisfied}
    steps: [5]
    label: the wait settles as satisfied when another person answers
  - type: no_reply
    step: 3
    label: the soul does not answer the first question before the window ends
  - type: reply_in
    place: space:tg:-1002
    step: 9
    count: 1
    label: exactly one answer after the patience window expires
  - type: mentions
    text: "Senja"
    step: 9
    label: the answer names the stored fact
steps:
  - at: "2026-11-10T12:00:00+07:00"
    who: person:tg:4001
    place: space:tg:-1002
    text: "Rapat minggu ini pindah ke kafe Kopi Senja jam sepuluh ya."
  - advance: "35m"
  - at: "2026-11-10T12:36:00+07:00"
    who: person:tg:4002
    place: space:tg:-1002
    text: "Eh, rapatnya di kafe apa ya? Aku lupa."
    should: answer
  - at: "2026-11-10T12:36:20+07:00"
    who: person:tg:4002
    place: space:tg:-1002
    text: "Maksudku rapat minggu ini yang dipindah itu."
    should: silent
  - at: "2026-11-10T12:36:50+07:00"
    who: person:tg:4003
    place: space:tg:-1002
    text: "Kopi Senja kayaknya."
    should: silent
  - at: "2026-11-10T12:37:10+07:00"
    who: person:tg:4001
    place: space:tg:-1002
    text: "Iya, Kopi Senja jam sepuluh."
    should: silent
  - at: "2026-11-10T12:37:40+07:00"
    who: person:tg:4002
    place: space:tg:-1002
    members: ["person:owner", "person:tg:4001", "person:tg:4002"]
    text: "Oke, makasih ya."
    should: silent
  - at: "2026-11-10T12:41:00+07:00"
    who: person:tg:4003
    place: space:tg:-1002
    text: "Eh, aku lupa lagi: rapatnya di kafe mana ya?"
    should: answer
  - advance: "2m"
model_answers:
  - step: 9
    tool: decide
    calls:
      - name: act
        arguments:
          capability: telegram.say
          arguments: {text: "Kopi Senja, jam sepuluh."}
