name: 24_gate_threshold
function: turn-taking
capability: "The gate keeps a busy group silent, an addressed line always wakes, the decision event stores its terms, and its go on an answerable question holds a wait that wakes the soul once."
description: >-
  The gate and the circuit breaker (core.md §6, core-math.md §3, §15). A busy
  group of six people stays silent: the soul's share of talk stays below the
  fair share 1/n, and the three log-derived terms of theta (talk_rate,
  promise_debt, budget_used) are stored in every decision event. Two group
  lines name the only document in play, the Q4 budget proposal, before the
  request, so "dokumennya" has exactly one referent; the meeting hour is a
  separate matter. An addressed message always wakes the PFC, an
  active promise reminded by an unaddressed message wakes it too, and once Mona
  knows the answer to a group question the gate opens and the kernel's wait
  answers it once, after the patience window.
expectations:
  - type: no_reply
    steps: [1, 2, 3, 4, 5, 6, 7, 8, 10, 11, 14]
    label: unaddressed chatter in a busy group stays silent
  - type: event_seen
    kind: model.call
    step: 9
    count: 1
    label: an addressed message always wakes
  - type: event_seen
    kind: decision.silent
    payload: {talk_rate: 0.0}
    steps: [1, 2, 3, 4, 5, 6, 7, 8]
    count: 8
    label: the gate stores its talk rate in the decision event
  - type: event_seen
    kind: decision.silent
    payload: {promise_debt: 0.0}
    steps: [1, 2, 3, 4, 5, 6, 7, 8]
    count: 8
    label: the gate stores the promise debt in the decision event
  - type: event_seen
    kind: decision.silent
    payload: {budget_used: 0.0}
    steps: [1, 2, 3, 4, 5, 6, 7, 8]
    count: 8
    label: the gate stores the budget used in the decision event
  - type: event_seen
    kind: expectation.reminded
    step: 12
    count: 1
    label: an active promise reminds the soul on an unaddressed message
  - type: reply_in
    place: space:tg:-1004
    step: 12
    count: 1
    label: the reminder wakes the PFC
  - type: event_seen
    kind: expectation.resolved
    step: 12
    count: 1
    label: the statement fulfils the promise once
  - type: sleep_done
    label: the answer to the group's question is stored
  - type: event_seen
    kind: expectation.created
    payload: {kind: wait}
    step: 15
    count: 1
    label: the gate's go on an answerable question creates the wait
  - type: reply_in
    place: space:tg:-1004
    step: 16
    count: 1
    label: the patience window wakes the soul exactly once
  - type: mentions_any
    texts: ["jam lima", "lima sore", "17:00", "17.00", "5 sore", "pukul 17"]
    step: 16
    label: the answer names the stored report hour in any of its formats
steps:
  - at: "2026-11-10T13:00:00+07:00"
    who: person:tg:7001
    place: space:tg:-1004
    text: "Pagi semua."
    should: silent
  - at: "2026-11-10T13:00:30+07:00"
    who: person:tg:7002
    place: space:tg:-1004
    text: "Pagi juga."
    should: silent
  - at: "2026-11-10T13:01:00+07:00"
    who: person:tg:7003
    place: space:tg:-1004
    text: "Ada agenda hari ini?"
    should: silent
  - at: "2026-11-10T13:01:30+07:00"
    who: person:tg:7004
    place: space:tg:-1004
    text: "Rapat jam sepuluh."
    should: silent
  - at: "2026-11-10T13:02:00+07:00"
    who: person:tg:7005
    place: space:tg:-1004
    text: "Oke siap."
    should: silent
  - at: "2026-11-10T13:02:30+07:00"
    who: person:tg:7006
    place: space:tg:-1004
    text: "Aku ikut rapat."
    should: silent
  - at: "2026-11-10T13:02:40+07:00"
    who: person:tg:7002
    place: space:tg:-1004
    text: "Proposal anggaran Q4 masih di-review Bu Rina."
    should: silent
  - at: "2026-11-10T13:02:50+07:00"
    who: person:tg:7003
    place: space:tg:-1004
    text: "Iya, proposal anggaran Q4 itu yang kita tunggu minggu ini."
    should: silent
  - at: "2026-11-10T13:03:00+07:00"
    who: person:tg:7001
    place: space:tg:-1004
    addressed: true
    text: "Mona, kabari aku ya kalau dokumennya sudah selesai."
  - at: "2026-11-10T13:04:00+07:00"
    who: person:tg:7002
    place: space:tg:-1004
    text: "Dokumennya masih di review."
    should: silent
  - at: "2026-11-10T13:04:30+07:00"
    who: person:tg:7003
    place: space:tg:-1004
    text: "Nanti rapat evaluasinya jam lima sore kayaknya."
    should: silent
  - at: "2026-11-10T13:05:00+07:00"
    who: person:tg:7004
    place: space:tg:-1004
    text: "Dokumennya sudah selesai kok."
    should: answer
  - at: "2026-11-10T13:06:00+07:00"
    who: person:tg:7006
    place: space:tg:-1004
    text: "Katanya rapat evaluasinya jam lima sore."
    should: silent
  - advance: "40m"
  - at: "2026-11-10T13:50:00+07:00"
    who: person:tg:7005
    place: space:tg:-1004
    text: "Eh, rapat evaluasinya jam berapa ya? Aku lupa."
    should: answer
  - advance: "2m"
model_answers:
  - step: 9
    tool: decide
    calls:
      - name: expect
        arguments:
          about: kabari pemilik kalau dokumennya sudah selesai
          kind: promise
          cue_event: {kind: percept, place: "space:tg:-1004"}
          expect: {text: "dokumen sudah selesai"}
          intent: beri tahu bahwa dokumennya sudah selesai
          weight: 0.7
          policy: {once: true}
  - step: 10
    tool: decide
    calls:
      - name: think
        arguments: {thought: "Masih di review; ini belum selesai, jadi janjinya tetap menunggu.", motivation: 1, confidence: 0.7}
  - step: 12
    tool: decide
    calls:
      - name: act
        arguments:
          capability: telegram.say
          arguments: {text: "Dokumennya sudah selesai, sesuai janjiku."}
      - name: resolve
        arguments: {id: 1, status: satisfied}
  - step: 16
    tool: decide
    calls:
      - name: act
        arguments:
          capability: telegram.say
          arguments: {text: "Jam lima sore, rapat evaluasinya."}
