name: 23_recall_episodes
function: memory
capability: "A month's episodes are recalled from the Log, with details from the original events."
description: >-
  The owner asks what happened last month. The swing-sleep never ran, so no
  episode memory exists and no vector was ever written; the soul recalls the
  month by time range from the Log itself and answers with details from the
  original events.
expectations:
  - type: event_seen
    kind: act.result
    step: 3
    payload: {capability: self.recall}
    text_contains: "Kopi Senja"
    label: recall returns the original event that named the cafe
  - type: mentions_any
    texts: ["dua belas", "12 persen"]
    step: 3
    label: the owner hears the price detail of the recalled month
  - type: reply_in
    place: space:tg:1001
    step: 3
    count: 1
    label: the owner hears the month's episodes back
  - type: mentions
    text: "Kopi Senja"
    step: 3
    label: the answer names the cafe from the recalled detail
  - type: max_calls
    capability: self.recall
    step: 3
    count: 2
    label: the month is recalled before answering, without a search loop
  - type: no_repeat_call
    step: 3
    label: the chain never repeats a capability call with the same arguments
  - type: prompt_contains
    text: "step: self.recall"
    step: 3
    label: the desk shows the recall step it already took
steps:
  - at: "2026-10-03T10:00:00+07:00"
    who: person:owner
    place: space:tg:1001
    text: "Kita buka kafe bulan depan. Namanya Kopi Senja."
    features: {addressed: 1}
  - at: "2026-10-20T16:30:00+07:00"
    who: person:owner
    place: space:tg:1001
    text: "Harga biji kopi naik dua belas persen."
    features: {addressed: 1}
  - at: "2026-11-11T09:00:00+07:00"
    who: person:owner
    place: space:tg:1001
    text: "apa yang kita lakukan bulan lalu?"
    features: {addressed: 1}
model_answers:
  - step: 3
    tool: decide
    calls:
      - name: act
        arguments:
          capability: self.recall
          arguments:
            from: "2026-10-01T00:00:00+07:00"
            to: "2026-11-01T00:00:00+07:00"
  - step: 3
    tool: decide
    calls:
      - name: act
        arguments:
          capability: telegram.say
          arguments:
            text: "Bulan lalu kita membuka Kopi Senja dan harga biji kopi naik dua belas persen."
  - step: 3
    tool: decide
    calls: []
