name: 29_help_clinic_hours
function: memory
capability: "An unaddressed question is answered with the clinic hours the soul remembers."
description: >-
  Unaddressed help, case five: a clinic's opening hours are said once in a
  neighborhood group while another member is already in the conversation, sleep
  keeps them, and later that member asks the hours without addressing Mona. The
  soul must answer from what it heard after the patience window expires.
expectations:
  - type: sleep_done
    label: sleep.done recorded
  - type: event_seen
    kind: expectation.created
    step: 4
    payload: {kind: wait}
    label: the unaddressed helpful cue holds a patience wait
  - type: reply_in
    place: space:tg:-1009
    step: 5
    count: 1
    label: exactly one answer in the group
  - type: mentions_any
    texts: ["empat sore", "4 sore", "jam 16"]
    step: 5
    label: the answer gives the clinic hours said in the group
steps:
  - at: "2026-11-10T10:58:00+07:00"
    who: person:tg:8401
    place: space:tg:-1009
    text: "Pagi, nanti sore aku mau ke pasar."
  - at: "2026-11-10T11:00:00+07:00"
    who: person:tg:8400
    place: space:tg:-1009
    text: "Klinik gigi dekat pasar buka jam empat sore sampai jam delapan malam."
  - at: "2026-11-10T11:00:00+07:00"
    advance: "35m"
  - at: "2026-11-10T11:36:00+07:00"
    who: person:tg:8401
    place: space:tg:-1009
    text: "Jam berapa klinik gigi buka ya? Aku lupa."
    should: answer
  - advance: "2m"
model_answers:
  - step: 3
    tool: call
    calls:
      - name: store_memories
        arguments:
          items:
            - text: "Klinik gigi dekat pasar buka jam empat sore sampai jam delapan malam"
              importance: 1.0
          core_memory: "Klinik gigi: jam empat sore sampai delapan malam."
  - step: 5
    tool: decide
    calls:
      - name: act
        arguments:
          capability: telegram.say
          arguments: {text: "Klinik gigi buka jam empat sore sampai jam delapan malam."}
