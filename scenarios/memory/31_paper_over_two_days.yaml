roles:
  fallback: unverified
  unverified:
    base: guest
  runner:
    base: trusted
    approval: yolo
people:
  person:owner:
    roles:
    - runner
description: Owner meminta penulisan paper di workspace dari data/metrics_log.txt yang panjangnya melebihi
  batas baca (harus lanjut via registry.more dan full.ref), lalu meminta revisi, mengirimkan ke Budi di
  WhatsApp dengan izin, menjadwalkan lanjut nanti malam sebelum proses restart, melanjutkan tepat dari
  progress.md & <doing> saat expectation malam aktif sekali, dan keesokan harinya menulis paper baru mengikuti
  format paper kemarin.
expectations:
- type: event_seen
  kind: act.out
  step: 2
  text_contains: registry.more
  label: overflowing metrics read continues through registry.more
- type: event_seen
  kind: act.out
  step: 2
  text_contains: progress.md
  label: progress.md is written during initial paper drafting
- type: reply_in
  place: space:tg:1001
  step: 2
  count: 1
  label: draft summary reaches the owner
- type: mentions
  text: '412'
  step: 2
  label: draft reports the throughput found after the truncation offset
- type: event_seen
  kind: act.out
  step: 3
  text_contains: paper_v1.md
  label: revision updates the paper in workspace
- type: event_seen
  kind: share.granted
  step: 4
  label: sharing the revised paper to Budi is recorded
- type: event_order
  steps:
  - 4
  first: share.granted
  then: act.out
  label: consent is recorded before WhatsApp delivery
- type: reply_in
  place: space:wa:628110001@s.whatsapp.net
  step: 4
  count: 1
  label: the revised paper reaches Budi on WhatsApp
- type: event_seen
  kind: expectation.created
  step: 5
  payload:
    kind: promise
  label: tonight continuation creates a timed promise expectation
- type: event_seen
  kind: expectation.fired
  step: 7
  count: 1
  label: tonight expectation fires after restart
- type: no_event
  kind: expectation.fired
  steps:
  - 7
  - 8
  count: 1
  label: tonight expectation fires only once
- type: event_seen
  kind: act.out
  step: 7
  text_contains: progress.md
  label: after restart the soul reads or updates progress.md
- type: prompt_contains
  text: progress.md
  step: 7
  label: resumed prompt sees progress.md
- type: prompt_contains
  text: <doing>
  step: 7
  label: resumed wake includes <doing> working memory
- type: reply_in
  place: space:tg:1001
  step: 7
  count: 1
  label: owner hears the completed closing section tonight
- type: event_seen
  kind: act.out
  step: 8
  text_contains: paper_v1.md
  label: next day inspects yesterday paper format
- type: event_seen
  kind: act.out
  step: 8
  text_contains: paper_v2.md
  label: next day writes new paper in workspace
- type: event_seen
  kind: act.out
  step: 8
  text_contains: '## Limitasi'
  label: new paper preserves yesterday section structure
- type: reply_in
  place: space:tg:1001
  step: 8
  count: 1
  label: owner is updated on the second paper
- type: refs_reachable
  min_refs: 1
  label: every archived long output ref opens cleanly
- type: honest
  label: nothing is claimed as done without its recorded act result
steps:
- at: '2026-11-11T09:00:00+07:00'
  who: person:budi
  place: space:wa:628110001@s.whatsapp.net
  text: Halo, ini nomor Budi ya.
- at: '2026-11-11T10:00:00+07:00'
  who: person:owner
  place: space:tg:1001
  addressed: true
  text: 'Tolong buatkan draft paper di papers/paper_v1.md dengan format persis: # Judul, ## Ringkasan,
    ## Data, ## Kesimpulan. Baca seluruh isi data/metrics_log.txt di workspace sampai akhir lewat registry.more
    kalau terpotong untuk ambil nilai APPENDIX_Z_MARKER, dan simpan catatan di progress.md.'
- at: '2026-11-11T11:00:00+07:00'
  who: person:owner
  place: space:tg:1001
  addressed: true
  text: 'Tolong revisi papers/paper_v1.md: tambahkan bagian ## Limitasi sebelum ## Kesimpulan, lalu perbarui
    progress.md.'
- at: '2026-11-11T13:00:00+07:00'
  who: person:owner
  place: space:tg:1001
  addressed: true
  text: Kirimkan ringkasan dan paper hasil revisinya ke Budi di WhatsApp sekarang.
- at: '2026-11-11T15:00:00+07:00'
  who: person:owner
  place: space:tg:1001
  addressed: true
  text: Lanjutkan nanti malam jam 20:00 untuk menulis bagian penutup akhir di papers/paper_v1.md, dan
    catat statusnya di progress.md.
- at: '2026-11-11T16:00:00+07:00'
  restart: true
- at: '2026-11-11T16:00:00+07:00'
  advance: 245m
- at: '2026-11-12T09:00:00+07:00'
  who: person:owner
  place: space:tg:1001
  addressed: true
  text: Pagi! Buatkan paper baru tentang Arsitektur Cache di papers/paper_v2.md mengikuti persis format
    bagian dari paper kemarin di workspace.
model_answers:
- step: 2
  tool: decide
  calls:
  - name: act
    arguments:
      capability: workspace.read
      arguments:
        path: data/metrics_log.txt
        limit: 200
- step: 2
  tool: decide
  calls:
  - name: act
    arguments:
      capability: registry.more
      arguments:
        ref: att_1200dc59aa37704b53b18f38
        offset: 19500
        limit: 8000
- step: 2
  tool: decide
  calls:
  - name: act
    arguments:
      capability: workspace.write
      arguments:
        path: papers/paper_v1.md
        text: '# Judul

          Benchmark Sistem


          ## Ringkasan

          Evaluasi throughput sistem.


          ## Data

          Exact throughput 412 req/s, p99 18 ms.


          ## Kesimpulan

          Stabil di 412 req/s.

          '
  - name: act
    arguments:
      capability: workspace.write
      arguments:
        path: progress.md
        text: '# Progress

          - Goal: tulis papers/paper_v1.md

          - Done: baca data/metrics_log.txt (412 req/s) dan tulis draft v1

          - Next: tunggu revisi owner

          - Files: data/metrics_log.txt, papers/paper_v1.md

          '
- step: 2
  tool: decide
  calls:
  - name: act
    arguments:
      capability: telegram.say
      arguments:
        text: Draft papers/paper_v1.md sudah ditulis dengan nilai benchmark 412 req/s, p99 18 ms, dan
          progress.md diperbarui.
- step: 3
  tool: decide
  calls:
  - name: act
    arguments:
      capability: workspace.write
      arguments:
        path: papers/paper_v1.md
        text: '# Judul

          Benchmark Sistem


          ## Ringkasan

          Evaluasi throughput sistem.


          ## Data

          Exact throughput 412 req/s, p99 18 ms.


          ## Limitasi

          Pengujian hanya mencakup satu beban sintetis.


          ## Kesimpulan

          Stabil di 412 req/s.

          '
  - name: act
    arguments:
      capability: workspace.write
      arguments:
        path: progress.md
        text: '# Progress

          - Goal: tulis papers/paper_v1.md

          - Done: revisi dengan bagian ## Limitasi

          - Next: siap dikirim bila diminta

          - Files: papers/paper_v1.md, progress.md

          '
- step: 3
  tool: decide
  calls:
  - name: act
    arguments:
      capability: telegram.say
      arguments:
        text: 'Revisi papers/paper_v1.md dengan bagian ## Limitasi selesai dan progress.md sudah diperbarui.'
- step: 4
  tool: decide
