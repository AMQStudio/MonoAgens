name: 27_help_wifi_password
description: >-
  Unaddressed help, case three: the office wifi password is said once in the
  group, sleep remembers it, and later an unaddressed "password wifi kantor apa
  ya?" must be answered because the soul knows it. The request never allocates
  the turn; the gate opens on feeling-of-knowing and the patience wait expires.
expectations:
  - type: sleep_done
    label: sleep.done recorded
  - type: event_seen
    kind: expectation.created
    step: 3
    payload: {kind: wait}
    label: the unaddressed helpful cue holds a patience wait
  - type: reply_in
    place: space:tg:-1007
    step: 4
    count: 1
    label: exactly one answer in the group
  - type: mentions
    text: "senja2026"
    step: 4
    label: the answer gives the password from memory
steps:
  - at: "2026-11-10T10:00:00+07:00"
    who: person:tg:8200
    place: space:tg:-1007
    text: "Password wifi kantor yang baru: senja2026, jangan lupa."
  - at: "2026-11-10T10:00:00+07:00"
    advance: "35m"
  - at: "2026-11-10T10:36:00+07:00"
    who: person:tg:8201
    place: space:tg:-1007
    text: "Ada yang ingat password wifi kantor? Aku baru datang."
    should: answer
  - advance: "2m"
model_answers:
  - step: 2
    tool: call
    calls:
      - name: store_memories
        arguments:
          items:
            - text: "Password wifi kantor yang baru: senja2026"
              importance: 1.0
          core_memory: "Password wifi kantor: senja2026."
  - step: 4
    tool: decide
    calls:
      - name: act
        arguments:
          capability: telegram.say
          arguments: {text: "Password wifi kantornya senja2026."}
