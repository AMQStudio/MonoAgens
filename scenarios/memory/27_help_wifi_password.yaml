name: 27_help_wifi_password
function: memory
capability: "An unaddressed question is answered with a password the soul learned in that group."
description: >-
  Unaddressed help, case three: the office wifi password is said once in the
  group while another member is already in the conversation, sleep remembers
  it, and later that member's unaddressed "password wifi kantor apa ya?" must
  be answered because the soul heard it. The request never allocates the turn;
  the gate opens on feeling-of-knowing and the patience wait expires.
expectations:
  - type: sleep_done
    label: sleep.done recorded
  - type: event_seen
    kind: expectation.created
    step: 4
    payload: {kind: wait}
    label: the unaddressed helpful cue holds a patience wait
  - type: reply_in
    place: space:tg:-1007
    step: 5
    count: 1
    label: exactly one answer in the group
  - type: mentions
    text: "senja2026"
    step: 5
    label: the answer gives the password said in the group
steps:
  - at: "2026-11-10T09:58:00+07:00"
    who: person:tg:8201
    place: space:tg:-1007
    text: "Pagi, aku sudah di kantor."
  - at: "2026-11-10T10:00:00+07:00"
    who: person:tg:8200
    place: space:tg:-1007
    text: "Password wifi kantor yang baru: senja2026, jangan lupa."
  - at: "2026-11-10T10:00:00+07:00"
    advance: "35m"
  - at: "2026-11-10T10:36:00+07:00"
    who: person:tg:8201
    place: space:tg:-1007
    text: "Ada yang ingat password wifi kantor? Aku lupa."
    should: answer
  - advance: "2m"
model_answers:
  - step: 3
    tool: call
    calls:
      - name: store_memories
        arguments:
          items:
            - text: "Password wifi kantor yang baru: senja2026"
              importance: 1.0
          core_memory: "Password wifi kantor: senja2026."
  - step: 5
    tool: decide
    calls:
      - name: act
        arguments:
          capability: telegram.say
          arguments: {text: "Password wifi kantornya senja2026."}
