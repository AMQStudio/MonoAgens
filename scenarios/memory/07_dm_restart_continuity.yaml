name: 07_dm_restart_continuity
function: memory
capability: "A restart keeps the conversation's context because the same Log is read again."
description: >-
  Diskusi di DM, bot restart di tengah percakapan, lalu owner melanjutkan topik.
  Kernel baru harus memakai database yang sama sehingga konteks "pindah kantor"
  masih ada di prompt setelah restart.
expectations:
  - reply
  - type: prompt_contains
    text: "pindah kantor"
    step: 4
    label: context preserved after restart
steps:
  - at: "2026-11-10T10:00:00+07:00"
    who: person:owner
    place: space:tg:1001
    text: "Mona, aku lagi mikirin rencana pindah kantor. Menurutmu gimana?"
    addressed: true
  - at: "2026-11-10T10:03:00+07:00"
    who: person:owner
    place: space:tg:1001
    text: "Kantor barunya lebih dekat rumah kan?"
    addressed: true
  - at: "2026-11-10T10:10:00+07:00"
    restart: true
  - at: "2026-11-10T10:11:00+07:00"
    who: person:owner
    place: space:tg:1001
    text: "Lanjut yang tadi ya, soal pindah kantor."
    addressed: true
