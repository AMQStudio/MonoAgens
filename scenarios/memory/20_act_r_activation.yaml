name: 20_act_r_activation
function: memory
capability: "A frequently used memory outranks newer, more important unused ones (ACT-R activation) and answers the question."
description: >-
  ACT-R activation: one memory is used many times (its use_count climbs with
  every retrieval), then sleep stores eight newer, never-used memories with a
  much higher importance. A later question must be answered from the used
  memory: by total activation A = B + w_ctx*cos + w_imp*importance the used
  memory outranks the newer unused ones, so it must be on the desk
  (top retrieve_k). A ranking by importance and exponential recency would drop
  it, because its importance is 0.01.
expectations:
  - type: sleep_done
    label: sleep.done recorded
  - type: prompt_contains
    step: 17
    place: space:cli
    text: "laci"
    label: the frequently used memory reaches the desk (its fact, not a fake-model importance)
  - type: mentions
    step: 17
    text: "laci"
    label: the answer uses the remembered location
